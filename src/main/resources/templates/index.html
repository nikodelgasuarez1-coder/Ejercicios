<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agenda Fútbol - Nuevo Jugador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <span class="navbar-brand fw-bold">⚽ Agenda de Fútbol</span>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white text-center">
                    <h4 class="mb-0">➕ Agregar Jugador</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/jugadores/guardar}"
                          th:object="${jugador}"
                          method="post">

                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-bold">Nombre</label>
                            <input type="text"
                                   id="nombre"
                                   th:field="*{nombre}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                                   placeholder="Ej: Lionel Messi">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('nombre')}"
                                 th:errors="*{nombre}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label fw-bold">Teléfono</label>
                            <input type="text"
                                   id="telefono"
                                   th:field="*{telefono}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'"
                                   placeholder="Ej: 3001234567">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('telefono')}"
                                 th:errors="*{telefono}">
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">
                                💾 Guardar Jugador
                            </button>
                            <a th:href="@{/jugadores/listar}" class="btn btn-outline-success">
                                📋 Ver Agenda
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
